# Decide which parts of the pipeline a push needs, then continue with
# continue_config.yml.
#
# The path-filtering orb diffs the push against main (or, on main itself,
# against the previous commit) and sets a pipeline parameter for each mapping
# line whose regex matches at least one changed file. Each regex is anchored
# as ^...$ and matched with grep -P.
#
#   run-tests  any changed file that is not Markdown
#   run-build  any changed file that is neither Markdown nor under spec/
#
# A push that only touches Markdown runs nothing; one that only touches
# Markdown and specs runs the test suite but does not build or push an image.
version: 2.1

setup: true

orbs:
  path-filtering: circleci/path-filtering@3.0.0

workflows:
  choose-pipeline:
    jobs:
      - path-filtering/filter:
          base-revision: main
          config-path: .circleci/continue_config.yml
          mapping: |
            (?!.*\.md$).*           run-tests true
            (?!spec/)(?!.*\.md$).*  run-build true
